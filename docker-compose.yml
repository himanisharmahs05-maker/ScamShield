services:
  # 1. PostgreSQL Database
  scamshield_db:
    image: postgres:15-alpine
    container_name: scamshield_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=scamshield_user
      - POSTGRES_PASSWORD=scamshield_password
      - POSTGRES_DB=scamshield_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Python Backend
  backend:
    build: ./backend
    container_name: scamshield_backend
    ports:
      - "8000:8000"
    environment:
      # Updated to use PostgreSQL connection string
      - DATABASE_URL=postgresql+asyncpg://scamshield_user:scamshield_password@scamshield_db:5432/scamshield_db
      - SECRET_KEY=CHANGE_THIS_TO_A_SUPER_SECRET_KEY
    depends_on:
      - scamshield_db
    volumes:
      - ./backend:/app  # Live reload for development

  # 3. React Frontend
  frontend:
    build: ./frontend
    container_name: scamshield_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules # Avoid overwriting node_modules
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data: